name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  docker:
    name: Docker (analyze / test / Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: analyze / test
        run: docker build --build-arg FLUTTER_VERSION="$FLUTTER_VERSION" --target check .
      - name: Web ビルド
        run: docker build --build-arg FLUTTER_VERSION="$FLUTTER_VERSION" --target web --output type=local,dest=build/web .

  android:
    name: Android debug ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter を入れる
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter build apk --debug

  apple:
    name: iOS / macOS 署名なしビルド
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter を入れる
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - run: flutter build macos --debug
